version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
