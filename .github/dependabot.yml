# The project is retired: version-update PRs are off (limit 0). Security updates still open PRs.
version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
